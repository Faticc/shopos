-- Подстановки ключей для каталога иконок.
--
-- Магазин писан под одну сборку, а каталог shop16.bin выгружен с другой.
-- Из 185 предметов конфигов 32 не находятся напрямую по трём причинам:
--
--   * мод зовётся иначе        gendustry  -> jgendustry
--   * предмет заменён заглушкой extracells -> ae2fc:ec2placeholder.*
--   * в dmg лежит износ, а не разновидность: броня и батарейки выгружены
--     с тем износом, какой был у показанного предмета
--
-- Три вида правил:
--   key  точный ключ -> точный ключ каталога
--   id   заменить только id, мета оставить: "a:5" -> "b:5"
--   flat заменить id и отбросить мета - в каталоге одна иконка на все мета
--
-- Правильное решение - выгрузить иконки с самой сборки магазина
-- (tools/geticons.py по её mods). Этот файл лечит расхождение, пока этого
-- не сделано, и после перевыгрузки почти весь станет не нужен.

{
	-- мод переименован, мета совпадают один в один (проверено по подписям
	-- всех 16 улучшений: производство, цветение, сито, эмуляции и прочее)
	id = {
		["gendustry:ApiaryUpgrade"] = "jgendustry:ItemApiaryUpgrade",
	},

	-- в каталоге одна заглушка на весь предмет, мета не разделены
	flat = {
		["extracells:part.base"]    = "ae2fc:ec2placeholder.part.base",
		["extracells:storage.fluid"] = "ae2fc:ec2placeholder.storage.fluid",
	},

	key = {
		-- в dmg износ, а не разновидность
		["IC2:itemBatCrystal:27"]            = "IC2:itemBatCrystal:26",
		["IC2:itemArmorNanoHelmet:6"]        = "IC2:itemArmorNanoHelmet:27",
		["GraviSuite:advLappack:27"]         = "GraviSuite:advLappack",
		["GraviSuite:advNanoChestPlate:27"]  = "GraviSuite:advNanoChestPlate",

		-- тот же предмет под другим мета в этой сборке
		["appliedenergistics2:item.ItemMultiMaterial:30"] =
			"appliedenergistics2:item.ItemMultiMaterial:66",   -- Карта ускорения
		["IC2:itemIngot:11"] = "AdvancedSolarPanel:asp_crafting_items:11", -- Слиток урана

		-- мод переименован, предмет один
		["gendustry:IndustrialApiary"] = "jgendustry:apiary",

		-- мода AdditionMod в каталоге нет, берём похожую по смыслу материю
		["AdditionMod:ItemMatter"] = "dwcity:Materia",
	},
}
