-- Настройки магазина. Установщик этот файл не перезаписывает.
{
	-- название в шапке и на экране ожидания
	title = "SHOP",

	-- каталог: цены из выгрузки клиента и иконки, собирается tools/shopcat.py
	catalog = "/data/catalog.bin",

	-- чем пополняется счёт: предмет из инвентаря игрока. Одна штука даёт
	-- coinValue монет на счёт
	currency = { id = "customnpcs:npcMoney", dmg = 0 },
	coinValue = 1,
	sign = "$",

	-- сколько монет стоит единица цены из выгрузки ("min" в prices.jsonl).
	-- 1 - один в один: алмазная кирка там 1.50, здесь 1.50 $. markup -
	-- наценка поверх: 1.2 значит всё на 20% дороже
	rate = 1,
	markup = 1.0,

	-- продавать ли вещи с NBT (броня и инструменты с зарядом, улучшениями,
	-- зачарованное) по цене обычного предмета из выгрузки. Экземпляры с
	-- разной энергией - один товар, выдаются начиная с самых целых.
	-- false - не показывать
	sellNbt = true,

	-- кто, встав на PIM, попадает в панель владельца
	admins = { "Fatic" },

	-- ресурсный счёт: сданное в «СКУПКУ» ложится на него по цене из
	-- выгрузки × buyRate процентов. Снять его нельзя, только потратить
	resSign = "рес",
	buyRate = 100,
	-- что скупается и что продаётся только за деньги. Это начальные списки:
	-- админка правит их на ходу и хранит на диске данных в rules.cfg - с
	-- первой правки главнее там
	resources = {
		"minecraft:iron_ingot", "minecraft:gold_ingot", "minecraft:diamond",
		"minecraft:redstone", "minecraft:coal", "minecraft:dye:4", "minecraft:quartz",
		"IC2:itemIngot", "IC2:itemIngot:1", "IC2:itemIngot:5", "IC2:itemIngot:6",
	},
	moneyOnly = {
		"AdvancedSolarPanel:asp_crafting_items:10", "IC2:itemOreIridium",
		"IC2:itemPartIridium", "IC2:itemShardIridium", "dwcity:Iridium_ingot",
		"dwcity:Materia",
	},

	-- часовой пояс журнала, часов от UTC (Москва - 3)
	timeZone = 3,

	-- МЭ-интерфейс под PIM: выдача вверх, приём монет вниз
	exportSide = "UP",
	pushSide = "DOWN",
	slots = 36,

	-- как показывать моды в разделах; чего нет - покажется как есть
	modNames = {
		IC2 = "IndustrialCraft 2",
		appliedenergistics2 = "Applied Energistics 2",
		minecraft = "Minecraft",
		AdvancedSolarPanel = "Advanced Solar Panels",
		GraviSuite = "Gravitation Suite",
		EnderIO = "Ender IO",
		ThermalExpansion = "Thermal Expansion",
		ThermalFoundation = "Thermal Foundation",
		BuildCraft = "BuildCraft",
		OpenComputers = "OpenComputers",
		Forestry = "Forestry",
		gendustry = "Gendustry",
		customnpcs = "Custom NPCs",
	},
}
