-- Настройки магазина. Установщик этот файл не перезаписывает.
{
	-- название в шапке и на экране ожидания
	title = "SHOP",

	-- каталог: цены из выгрузки клиента и иконки, собирается tools/shopcat.py
	catalog = "/data/catalog.bin",

	-- чем пополняется счёт: предмет из инвентаря игрока. Одна штука даёт
	-- coinValue монет на счёт
	currency = { id = "customnpcs:npcMoney", dmg = 0 },
	coinValue = 1,
	sign = "$",

	-- сколько монет стоит единица цены из выгрузки ("min" в prices.jsonl).
	-- 1 - один в один: алмазная кирка там 1.50, здесь 1.50 $. markup -
	-- наценка поверх: 1.2 значит всё на 20% дороже
	rate = 1,
	markup = 1.0,

	-- МЭ-интерфейс под PIM: выдача вверх, приём монет вниз
	exportSide = "UP",
	pushSide = "DOWN",
	slots = 36,

	-- как показывать моды в разделах; чего нет - покажется как есть
	modNames = {
		IC2 = "IndustrialCraft 2",
		appliedenergistics2 = "Applied Energistics 2",
		minecraft = "Minecraft",
		AdvancedSolarPanel = "Advanced Solar Panels",
		GraviSuite = "Gravitation Suite",
		EnderIO = "Ender IO",
		ThermalExpansion = "Thermal Expansion",
		ThermalFoundation = "Thermal Foundation",
		BuildCraft = "BuildCraft",
		OpenComputers = "OpenComputers",
		Forestry = "Forestry",
		gendustry = "Gendustry",
		customnpcs = "Custom NPCs",
	},
}
